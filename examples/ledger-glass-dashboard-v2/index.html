<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부 글래스 대시보드 v2</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('ledger-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* 색은 세 가지: 초록(수입·핵심), 검정(주 버튼·지출, 다크에서는 밝은 색), 흰색(보조 카드). 배경은 단일 그라데이션. 그림자는 위쪽 광원 하나. */
:root {
  --bg-grad: linear-gradient(165deg, #10242A 0%, #0B161B 55%, #0A1216 100%);
  --ink: #EAF4F2;
  --ink-2: rgba(234, 244, 242, .74);
  --ink-3: rgba(234, 244, 242, .56);
  --green: #34D1B2;
  --on-green: #04201A;
  --strong: #EAF4F2;
  --on-strong: #0A1216;
  --card: rgba(255, 255, 255, .07);
  --well: rgba(255, 255, 255, .07);
  --well-2: rgba(255, 255, 255, .12);
  --grid: rgba(255, 255, 255, .10);
  --edge: rgba(255, 255, 255, .14);
  --hl: rgba(255, 255, 255, .34);
  --solid: #15282E;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  --lift-1: 0 6px 18px -10px rgba(0, 0, 0, .5);
  --lift-2: 0 24px 60px -20px rgba(0, 0, 0, .7);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.3, .5, 1);
}
:root[data-theme="light"] {
  --bg-grad: linear-gradient(165deg, #E6F0EE 0%, #EFF5F4 55%, #F4F7F7 100%);
  --ink: #0D1F1D;
  --ink-2: rgba(13, 31, 29, .74);
  --ink-3: rgba(13, 31, 29, .56);
  --green: #0A7D69;
  --on-green: #FFFFFF;
  --strong: #0F1413;
  --on-strong: #FFFFFF;
  --card: rgba(255, 255, 255, .66);
  --well: rgba(13, 31, 29, .05);
  --well-2: rgba(13, 31, 29, .09);
  --grid: rgba(13, 31, 29, .10);
  --edge: rgba(13, 31, 29, .09);
  --hl: rgba(255, 255, 255, .95);
  --solid: #F7FAF9;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  --lift-1: 0 6px 18px -12px rgba(20, 60, 55, .28);
  --lift-2: 0 24px 60px -24px rgba(20, 60, 55, .38);
}
* { box-sizing: border-box; }
html { color-scheme: dark; scroll-behavior: smooth; }
html[data-theme="light"] { color-scheme: light; }
body { margin: 0; min-height: 100vh; background: var(--bg-grad) fixed; background-color: #0A1216; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* 유리는 바깥 패널·레일·탭바에만. 안쪽 카드는 평평한 반투명 면(유리 위에 유리를 겹치지 않는다). */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--edge), var(--lift-2);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--solid); } }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--solid); -webkit-backdrop-filter: none; backdrop-filter: none; } }
.card { border-radius: 24px; background: var(--card); box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--edge), var(--lift-1); min-width: 0; }

/* ---------- 레이아웃 ---------- */
.shell { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
.rail { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 28px; z-index: 30; }
.rail .sp { flex: 1; min-height: 12px; }
.nb { width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: var(--ink-2); transition: background .2s, color .2s, transform .25s var(--spring); }
.nb:hover { background: var(--well-2); color: var(--ink); }
.nb:active { transform: scale(.92); }
.nb svg { width: 20px; height: 20px; }
.nb.main { background: var(--strong); color: var(--on-strong); }
.nb.main:hover { background: var(--strong); filter: brightness(1.15); color: var(--on-strong); }
.nl { display: none; }
.theme .moon { display: none; }
:root[data-theme="light"] .theme .sun { display: none; }
:root[data-theme="light"] .theme .moon { display: block; }
.panel { border-radius: 36px; padding: 28px 28px 28px; min-width: 0; }
.greet { margin: 0 0 20px 4px; }
.greet h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.greet p { margin: 4px 0 0; color: var(--ink-2); }
.board { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "bal" "tiles" "chart" "limit" "act"; }
.a-bal { grid-area: bal; } .a-tiles { grid-area: tiles; } .a-chart { grid-area: chart; } .a-limit { grid-area: limit; } .a-act { grid-area: act; }
@media (min-width: 760px) { .board { grid-template-columns: 1fr 1fr; grid-template-areas: "bal tiles" "chart chart" "limit limit" "act act"; } }
@media (min-width: 1180px) { .board { grid-template-columns: minmax(280px, .9fr) minmax(330px, 1fr) minmax(0, 1.25fr); grid-template-areas: "bal tiles chart" "limit act act"; } }
section[id] { scroll-margin-top: 20px; }

@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-bottom: 112px; }
  .rail { position: fixed; left: 16px; right: 16px; bottom: 12px; top: auto; flex-direction: row; justify-content: space-around; align-items: stretch; padding: 8px 6px; border-radius: 30px; }
  .rail .sp { display: none; }
  .nb { width: auto; flex: 1; height: 56px; border-radius: 22px; gap: 2px; align-content: center; }
  .nb svg { width: 22px; height: 22px; justify-self: center; }
  .nl { display: block; font-size: .7rem; line-height: 1; }
  .panel { padding: 20px 14px 18px; border-radius: 30px; }
}

/* ---------- 남은 돈 ---------- */
.bal { padding: 22px 22px 22px; display: flex; flex-direction: column; }
.tl { margin: 0; color: var(--ink-2); font-size: .92rem; }
.hero-amount { margin: 8px 0 8px; font-size: clamp(2.6rem, 6vw, 3rem); line-height: 1.08; font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.hero-amount small { font-size: .45em; font-weight: 600; letter-spacing: 0; margin-left: 4px; color: var(--ink-2); }
.chip { align-self: flex-start; display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: var(--well-2); font-size: .82rem; font-weight: 600; }
.btns { margin-top: auto; padding-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 120px; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; font-weight: 700; transition: transform .2s var(--spring), filter .2s; white-space: nowrap; }
.btn.dark { background: var(--strong); color: var(--on-strong); }
.btn.light { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.97); }

/* ---------- 수치 카드 2x2 ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { padding: 16px 16px 14px; display: flex; flex-direction: column; min-width: 0; }
.tile .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--well-2); color: var(--ink-2); flex: none; }
.dot svg { width: 15px; height: 15px; }
.tv { margin: 14px 0 0; font-size: clamp(1.05rem, 1.7vw, 1.3rem); line-height: 1.2; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; }
.ts { margin: auto 0 0; padding-top: 12px; }
.pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--well-2); font-size: .74rem; font-weight: 600; }
.tile.fill { background: var(--green); color: var(--on-green); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--lift-1); }
.tile.fill .tl { color: var(--on-green); opacity: .92; }
.tile.fill .dot, .tile.fill .pill { background: rgba(255,255,255,.22); color: var(--on-green); }
:root[data-theme="dark"] .tile.fill .dot, :root:not([data-theme="light"]) .tile.fill .dot { background: rgba(4,32,26,.16); }
:root:not([data-theme="light"]) .tile.fill .pill { background: rgba(4,32,26,.16); }

/* ---------- 수입·지출 차트 ---------- */
.chartcard { padding: 20px 20px 16px; display: flex; flex-direction: column; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.head p { margin: 2px 0 0; color: var(--ink-2); font-size: .9rem; }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; font-size: .85rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.legend .in i { background: var(--green); }
.legend .ex i { background: var(--strong); }
.switch { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--well-2); font-weight: 600; font-size: .88rem; transition: transform .2s var(--spring); }
.switch:active { transform: scale(.96); }
.plotwrap { padding: 10px 0 0 52px; margin-top: auto; }
.plot { position: relative; }
.gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--grid); }
.gl span { position: absolute; left: -52px; top: -.7em; width: 44px; text-align: right; white-space: nowrap; font-size: .76rem; color: var(--ink-3); }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; }
.col { height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; border-radius: 12px; outline-offset: -2px; }
.col:hover, .col:focus-visible { background: var(--well); }
.bi, .be { width: min(14px, 30%); border-radius: 4px 4px 0 0; }
.bi { background: var(--green); }
.be { background: var(--strong); }
.mlabels { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 8px; text-align: center; font-size: .85rem; color: var(--ink-2); }
.mlabels .now { color: var(--ink); font-weight: 600; }
.foot { margin: 10px 0 0; color: var(--ink-3); font-size: .8rem; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 500; font-size: .86rem; }
tbody tr:last-child td { border-bottom: 0; }

/* ---------- 한도 ---------- */
.limit { padding: 20px 20px 20px; }
.limit h2 { margin: 0 0 14px; font-size: 1.1rem; font-weight: 600; }
.lfield { display: block; margin-bottom: 14px; }
.lfield > span { display: block; margin: 0 0 6px 4px; font-size: .86rem; color: var(--ink-2); }
.input { width: 100%; min-height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--well); color: var(--ink); }
.input::placeholder { color: var(--ink-3); }
.iw { position: relative; }
.iw .input { padding-right: 46px; font-size: 1.1rem; font-weight: 600; }
.iw em { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-2); }
.meter { height: 10px; border-radius: 999px; background: var(--well-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--green); transition: width .6s var(--spring); }
.lnote { margin: 10px 2px 0; color: var(--ink-2); font-size: .9rem; }

/* ---------- 최근 내역 ---------- */
.act { padding: 20px 20px 14px; display: flex; flex-direction: column; }
.act-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.act-head h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.ctrls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
.search .input { width: 200px; padding: 0 16px 0 40px; font-size: .95rem; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--well); }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: .9rem; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); }
.scroll { overflow: auto; max-height: 340px; }
.scroll table { min-width: 560px; }
.scroll tbody tr:hover { background: var(--well); }
.who { display: flex; align-items: center; gap: 12px; text-align: left; }
.who .bd { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--well-2); color: var(--ink-2); flex: none; }
.who .bd.in { background: var(--green); color: var(--on-green); border-radius: 50%; }
.who .bd svg { width: 18px; height: 18px; }
.who b { display: block; font-weight: 600; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--strong); display: block; }
.st.in i { background: var(--green); }
.amt.in { color: var(--green); font-weight: 600; }
.empty { padding: 24px 6px; color: var(--ink-2); text-align: center; }

/* ---------- 툴팁 ---------- */
.tip { position: fixed; z-index: 40; pointer-events: none; padding: 10px 14px; border-radius: 14px; background: var(--solid); box-shadow: inset 0 0 0 1px var(--edge), var(--lift-2); font-size: .9rem; opacity: 0; transition: opacity .12s; max-width: 230px; }
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 600; }
.tip span { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>

<div class="shell">
  <nav class="rail glass" aria-label="대시보드 메뉴">
    <a class="nb" href="#sec-summary" aria-label="요약" title="요약"><svg aria-hidden="true"><use href="#i-home"/></svg><span class="nl">요약</span></a>
    <a class="nb" href="#sec-chart" aria-label="월별 수입과 지출" title="월별 수입과 지출"><svg aria-hidden="true"><use href="#i-bars"/></svg><span class="nl">월별</span></a>
    <a class="nb" href="#sec-limit" aria-label="지출 한도" title="지출 한도"><svg aria-hidden="true"><use href="#i-gauge"/></svg><span class="nl">한도</span></a>
    <a class="nb" href="#sec-act" aria-label="최근 내역" title="최근 내역"><svg aria-hidden="true"><use href="#i-list"/></svg><span class="nl">내역</span></a>

    <span class="sp"></span>
    <button class="nb theme" id="theme" type="button" aria-label="라이트 모드로 전환" title="모드 전환">
      <svg class="sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <span class="nl">모드</span>
    </button>
  </nav>

  <main class="panel glass">
    <header class="greet">
      <h1 id="greet">안녕하세요</h1>
      <p id="sub"></p>
    </header>

    <div class="board">
      <section class="card bal a-bal" id="sec-summary" aria-labelledby="bl">
        <p class="tl" id="bl">이번 달 남은 돈</p>
        <p class="hero-amount" id="balance">0원</p>
        <span class="chip" id="chip"></span>
        <div class="btns">
          <a class="btn dark" href="../ledger/index.html">내역 추가</a>
          <a class="btn light" href="#sec-act">내역 보기</a>
        </div>
      </section>

      <div class="tiles a-tiles">
        <article class="card tile fill">
          <div class="top"><p class="tl">수입</p><span class="dot"><svg aria-hidden="true"><use href="#i-down"/></svg></span></div>
          <p class="tv" id="inc">0원</p>
          <p class="ts"><span class="pill">이번 달</span></p>
        </article>
        <article class="card tile">
          <div class="top"><p class="tl">지출</p><span class="dot"><svg aria-hidden="true"><use href="#i-up"/></svg></span></div>
          <p class="tv" id="exp">0원</p>
          <p class="ts"><span class="pill">이번 달</span></p>
        </article>
        <article class="card tile">
          <div class="top"><p class="tl">하루 평균</p><span class="dot"><svg aria-hidden="true"><use href="#i-avg"/></svg></span></div>
          <p class="tv" id="avg">0원</p>
          <p class="ts"><span class="pill" id="avgp"></span></p>
        </article>
        <article class="card tile">
          <div class="top"><p class="tl">거래 건수</p><span class="dot"><svg aria-hidden="true"><use href="#i-receipt"/></svg></span></div>
          <p class="tv" id="cnt">0건</p>
          <p class="ts"><span class="pill">이번 달</span></p>
        </article>
      </div>

      <section class="card chartcard a-chart" id="sec-chart" aria-labelledby="ch">
        <div class="head">
          <div>
            <h2 id="ch">월별 수입과 지출</h2>
            <p id="cin"></p>
          </div>
          <div class="tools">
            <div class="legend" aria-hidden="true"><span class="in"><i></i>수입</span><span class="ex"><i></i>지출</span></div>
            <button class="switch" id="switch" type="button" aria-pressed="false">표로 보기</button>
          </div>
        </div>
        <div id="chart"></div>
        <div class="tablewrap" id="tbl" hidden></div>
        <p class="foot">지난 달 막대는 화면 확인용 예시 데이터예요. 이번 달만 실제 내역이에요.</p>
      </section>

      <section class="card limit a-limit" id="sec-limit" aria-labelledby="lh">
        <h2 id="lh">이번 달 지출 한도</h2>
        <label class="lfield">
          <span>한도 금액</span>
          <div class="iw"><input class="input" id="limit" inputmode="numeric" autocomplete="off"><em>원</em></div>
        </label>
        <div class="meter" role="img" id="lmeterA11y" aria-label="한도 대비 지출"><i id="lmeter"></i></div>
        <p class="lnote" id="lnote"></p>
      </section>

      <section class="card act a-act" id="sec-act" aria-labelledby="ah">
        <div class="act-head">
          <h2 id="ah">최근 내역</h2>
          <div class="ctrls">
            <label class="search">
              <span class="vh">내역 검색</span>
              <svg aria-hidden="true"><use href="#i-search"/></svg>
              <input class="input" id="q" type="search" placeholder="메모·카테고리 검색" autocomplete="off">
            </label>
            <div class="seg" role="group" aria-label="구분 필터" id="filter">
              <button type="button" data-f="all" aria-pressed="true">전체</button>
              <button type="button" data-f="income" aria-pressed="false">수입</button>
              <button type="button" data-f="expense" aria-pressed="false">지출</button>
            </div>
          </div>
        </div>
        <div class="scroll" id="rows"></div>
      </section>
    </div>
  </main>
</div>

<div class="tip" id="tip" role="tooltip"></div>

<script>
(function () {
  var CATS = {
    food: ['식비', 'i-food'], transit: ['교통', 'i-transit'], shop: ['쇼핑', 'i-shop'], home: ['주거', 'i-home'], fun: ['여가', 'i-fun'], etc: ['기타', 'i-etc'],
    salary: ['월급', 'i-wallet'], allow: ['용돈', 'i-gift'], otherin: ['기타 수입', 'i-plus']
  };
  var KEY = 'ledger-test-v1', LKEY = 'ledger-limit';
  var $ = function (id) { return document.getElementById(id); };
  var now = new Date();
  var Y = now.getFullYear(), M = now.getMonth(), D = now.getDate();
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ym = Y + '-' + pad(M + 1);
  var iso = function (d) { return ym + '-' + pad(d); };
  var won = function (n) { return n.toLocaleString('ko-KR') + '원'; };
  var man = function (n) { return n >= 10000 ? (Math.round(n / 1000) / 10).toString().replace(/\.0$/, '') + '만' : String(n); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var icon = function (id) { return '<svg aria-hidden="true"><use href="#' + id + '"/></svg>'; };

  function seed() {
    var d = function (n) { return iso(Math.min(n, D)); };
    var list = [
      ['income', 2800000, 'salary', '11월 월급', d(1)], ['expense', 450000, 'home', '월세', d(1)],
      ['expense', 9000, 'food', '점심 김치찌개', d(2)], ['expense', 1450, 'transit', '지하철', d(2)],
      ['expense', 5200, 'food', '카페 라테', d(3)], ['expense', 89000, 'shop', '운동화', d(3)],
      ['income', 50000, 'allow', '부모님 용돈', d(3)], ['expense', 15000, 'fun', '영화', d(4)],
      ['expense', 18500, 'food', '저녁 파스타', d(4)], ['expense', 12800, 'transit', '택시', d(5)],
      ['expense', 55000, 'etc', '통신비', d(5)], ['expense', 6300, 'food', '아침 샌드위치', d(6)]
    ];
    return list.map(function (r, i) { return { id: 's' + i, type: r[0], amount: r[1], cat: r[2], memo: r[3], date: r[4] }; });
  }
  var entries;
  try { var raw = localStorage.getItem(KEY); entries = raw ? JSON.parse(raw) : seed(); } catch (e) { entries = seed(); }
  var list = entries.filter(function (e) { return e.date.indexOf(ym) === 0; });
  var inc = 0, exp = 0;
  list.forEach(function (e) { if (e.type === 'income') inc += e.amount; else exp += e.amount; });

  /* ---------- 인사말 · 요약 ---------- */
  var h = now.getHours();
  $('greet').textContent = h < 5 ? '늦은 시간이에요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
  $('sub').textContent = (M + 1) + '월 가계 현황을 한눈에 확인해요.';
  var bal = inc - exp;
  $('balance').innerHTML = (bal < 0 ? '−' : '') + Math.abs(bal).toLocaleString('ko-KR') + '<small>원</small>';
  var chip;
  if (!inc && !exp) chip = '아직 내역이 없어요';
  else if (!inc) chip = '수입 내역이 없어요';
  else if (exp > inc) chip = '수입보다 ' + won(exp - inc) + ' 더 썼어요';
  else chip = '수입의 ' + Math.round(exp / inc * 100) + '%를 썼어요';
  $('chip').textContent = chip;
  $('inc').textContent = won(inc);
  $('exp').textContent = won(exp);
  $('avg').textContent = won(Math.round(exp / D));
  $('avgp').textContent = D + '일 기준';
  $('cnt').textContent = list.length + '건';

  /* ---------- 월 지출 한도 ---------- */
  var limit = 700000;
  try { var l = parseInt(localStorage.getItem(LKEY), 10); if (l > 0) limit = l; } catch (e) {}
  var limitEl = $('limit');
  function renderLimit() {
    $('lmeter').style.width = Math.min(100, Math.round(exp / limit * 100)) + '%';
    $('lmeterA11y').setAttribute('aria-label', '한도 대비 지출 ' + Math.round(exp / limit * 100) + '%');
    $('lnote').textContent = exp > limit
      ? '한도를 ' + won(exp - limit) + ' 넘겼어요.'
      : '한도까지 ' + won(limit - exp) + ' 남았어요. (' + Math.round(exp / limit * 100) + '% 사용)';
  }
  limitEl.value = limit.toLocaleString('ko-KR');
  limitEl.addEventListener('input', function () {
    var digits = limitEl.value.replace(/\D/g, '').slice(0, 10);
    var v = digits ? parseInt(digits, 10) : 0;
    limitEl.value = v ? v.toLocaleString('ko-KR') : '';
    if (v > 0) { limit = v; try { localStorage.setItem(LKEY, String(v)); } catch (e) {} renderLimit(); }
  });
  limitEl.addEventListener('blur', function () { limitEl.value = limit.toLocaleString('ko-KR'); });

  /* ---------- 월별 수입·지출 차트 ---------- */
  var S_EXP = [812000, 689000, 755000, 904000, 641000];
  var S_INC = [2800000, 2800000, 2850000, 2900000, 2800000];
  var months = [];
  for (var i = 5; i >= 0; i--) {
    var dt = new Date(Y, M - i, 1);
    months.push({ label: (dt.getMonth() + 1) + '월', inc: i === 0 ? inc : S_INC[5 - i], exp: i === 0 ? exp : S_EXP[5 - i], now: i === 0 });
  }
  var H = 210, chart = $('chart'), tbl = $('tbl'), tip = $('tip');
  (function drawChart() {
    var maxV = Math.max.apply(null, months.map(function (m) { return Math.max(m.inc, m.exp); })) * 1.08;
    var steps = [100000, 200000, 250000, 500000, 1000000, 2000000, 2500000, 5000000], step = steps[steps.length - 1], k;
    for (k = 0; k < steps.length; k++) { if (Math.ceil(maxV / steps[k]) <= 4) { step = steps[k]; break; } }
    var top = Math.ceil(maxV / step) * step, ticks = '';
    for (var t = 0; t <= top; t += step) ticks += '<div class="gl" style="bottom:' + (t / top * H) + 'px"><span>' + (t ? man(t) : '0') + '</span></div>';
    var cols = months.map(function (m, idx) {
      return '<div class="col" tabindex="0" data-i="' + idx + '" role="listitem" aria-label="' + m.label + ' 수입 ' + won(m.inc) + ', 지출 ' + won(m.exp) + (m.now ? ', 진행 중' : ', 예시 데이터') + '">' +
        '<i class="bi" style="height:' + Math.max(3, m.inc / top * H) + 'px"></i><i class="be" style="height:' + Math.max(3, m.exp / top * H) + 'px"></i></div>';
    }).join('');
    chart.innerHTML = '<div class="plotwrap"><div class="plot" style="height:' + H + 'px">' + ticks + '<div class="cols" role="list">' + cols + '</div></div>' +
      '<div class="mlabels">' + months.map(function (m) { return '<span' + (m.now ? ' class="now"' : '') + '>' + m.label + '</span>'; }).join('') + '</div></div>';
    $('cin').textContent = '최근 6개월 비교';
    chart.querySelectorAll('.col').forEach(function (el) {
      var m = months[+el.dataset.i];
      function show(x, y) {
        tip.innerHTML = '<b>' + m.label + '</b><span>수입 ' + won(m.inc) + '</span><br><span>지출 ' + won(m.exp) + '</span><br><span>' + (m.now ? '진행 중인 달' : '예시 데이터') + '</span>';
        tip.classList.add('on');
        var w = tip.offsetWidth, hh = tip.offsetHeight;
        tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + 'px';
        tip.style.top = Math.max(8, Math.min(window.innerHeight - hh - 8, y - hh - 10)) + 'px';
      }
      el.addEventListener('pointermove', function (ev) { show(ev.clientX, ev.clientY); });
      el.addEventListener('pointerleave', function () { tip.classList.remove('on'); });
      el.addEventListener('focus', function () { var b = el.getBoundingClientRect(); show(b.left + b.width / 2, b.top); });
      el.addEventListener('blur', function () { tip.classList.remove('on'); });
    });
    tbl.innerHTML = '<table><caption class="vh">월별 수입과 지출 표</caption><thead><tr><th scope="col">월</th><th scope="col">수입</th><th scope="col">지출</th><th scope="col">구분</th></tr></thead><tbody>' +
      months.map(function (m) { return '<tr><td>' + m.label + '</td><td>' + won(m.inc) + '</td><td>' + won(m.exp) + '</td><td>' + (m.now ? '진행 중' : '예시') + '</td></tr>'; }).join('') + '</tbody></table>';
  })();
  $('switch').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', String(on));
    this.textContent = on ? '차트로 보기' : '표로 보기';
    chart.hidden = on; tbl.hidden = !on; tip.classList.remove('on');
  });

  /* ---------- 최근 내역 표: 검색 · 필터 ---------- */
  var state = { q: '', f: 'all' };
  var sorted = list.map(function (e, i) { return { e: e, i: i }; })
    .sort(function (a, b) { return a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : b.i - a.i; })
    .map(function (x) { return x.e; });
  function renderRows() {
    var q = state.q.trim().toLowerCase();
    var rows = sorted.filter(function (e) {
      if (state.f !== 'all' && e.type !== state.f) return false;
      if (!q) return true;
      var c = CATS[e.cat] || CATS.etc;
      return (e.memo || '').toLowerCase().indexOf(q) >= 0 || c[0].toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) { $('rows').innerHTML = '<p class="empty">' + (list.length ? '조건에 맞는 내역이 없어요. 검색어나 필터를 바꿔 보세요.' : '이번 달 내역이 없어요. 내역 추가에서 첫 내역을 입력해 보세요.') + '</p>'; return; }
    $('rows').innerHTML = '<table><caption class="vh">최근 내역</caption><thead><tr><th scope="col">내역</th><th scope="col">카테고리</th><th scope="col">금액</th><th scope="col">구분</th><th scope="col">날짜</th></tr></thead><tbody>' +
      rows.map(function (e) {
        var c = CATS[e.cat] || CATS.etc, isIn = e.type === 'income';
        return '<tr><td><span class="who"><span class="bd' + (isIn ? ' in' : '') + '">' + icon(c[1]) + '</span><b>' + (e.memo ? esc(e.memo) : c[0]) + '</b></span></td>' +
          '<td>' + c[0] + '</td><td class="amt' + (isIn ? ' in' : '') + '">' + (isIn ? '+' : '−') + won(e.amount) + '</td>' +
          '<td><span class="st' + (isIn ? ' in' : '') + '"><i></i>' + (isIn ? '수입' : '지출') + '</span></td>' +
          '<td>' + parseInt(e.date.slice(5, 7), 10) + '월 ' + parseInt(e.date.slice(8), 10) + '일</td></tr>';
      }).join('') + '</tbody></table>';
  }
  $('q').addEventListener('input', function () { state.q = this.value; renderRows(); });
  $('filter').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    state.f = b.dataset.f;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    renderRows();
  });

  /* ---------- 다크 · 라이트 ---------- */
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    $('theme').setAttribute('aria-label', t === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
    if (persist) { try { localStorage.setItem('ledger-theme', t); } catch (e) {} }
  }
  $('theme').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });
  applyTheme(document.documentElement.getAttribute('data-theme'), false);

  renderLimit();
  renderRows();
})();
</script>
</body>
</html>
