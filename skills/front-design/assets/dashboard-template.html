<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<!--
  대시보드 템플릿 (front-hxxnn 플러그인)
  사용법: 이 파일을 복사한 뒤 맨 위 <script>의 CONFIG(주제·문구·데이터·위젯 구성)만 바꾼다.
  - 고정: 아이콘 레일과 선택 물방울, 떠 있는 상단 바, 큰 유리 패널, 색상 설정 패널, 처음 열 때의 순차 등장.
  - 가변: 패널 안의 위젯. 종류·개수·너비(span)·카드 여부(card)를 CONFIG.widgets 에서 정한다.
  - 샘플 값에는 "예시"라고 표시되어 있다. 실제 데이터로 바꾸면 chart.note 같은 예시 안내를 지운다.
  - 아이콘은 아래 스프라이트(<symbol id="i-...">)에 있는 것만 쓴다. 필요하면 같은 형식으로 추가한다.
  - rail-goo.js 는 이 파일과 같은 폴더에 함께 복사한다(없으면 선택 표시가 채움색으로 동작).
-->
<script>
/* =====================================================================
   CONFIG: 여기만 바꾼다. (주제, 문구, 데이터, 위젯 구성)
   파일 맨 위에 있고, 아래의 렌더링·스타일·색상 패널은 바꾸지 않는다.
   아래 값은 "프로젝트 예산" 샘플이다. 모든 숫자는 예시다.

   구성: 위젯(widgets)을 원하는 만큼, 원하는 너비(span: 12칸 중 몇 칸)로 나열한다. 위에서부터 차례로 빈칸 없이 채워진다.
     card: false 로 두면 카드 배경 없이 패널 위에 바로 놓인다(지표 줄, 표 등).
     nav: { label, icon } 를 주면 왼쪽 레일 메뉴에 나타나고, 스크롤 위치에 따라 물방울이 따라간다.
   위젯 종류(type)와 주요 속성
     hero      대표 숫자 하나  { label, value, unit, chip, stats:[{label,value,unit,tone:'accent'}], actions:[{label,href,style:'dark'|'light'}] }
     stats     지표 묶음      { title, items:[{label,value,unit,sub,icon,tone:'accent',spark:[숫자...]}] }
     chart     막대/선 차트   { title, subtitle, kind:'bar'|'line', series:[{name,values}](1~3개), labels, axis:{unit,compact:'ko'|'none'|{size,label},max,tickUnit}, nowIndex, sampleCount, note }
     progress  진행률 막대    { title, items:[{label,current,target,unit,editable,editLabel,storageKey,remaining,over,pill:{text,over}}] }
     table     표            { title, columns:[{key,label,type:'primary'|'text'|'number'|'badge',align:'left'|'right'|'center',unit,sign,iconKey,icons,labels}], rows, search:{keys,placeholder}, filter:{key,options:[{value,label}]}, maxHeight, empty, noMatch }
     list      순위·구성 목록 { title, items:[{label,value,unit,sub,icon}], max }
     callout   안내 문장      { title, text }  (text 안의 **굵게** 가능)
   값(value)은 숫자 또는 미리 만든 문자열("12:30")이다. 아이콘은 아래 스프라이트의 id("i-...")만 쓴다.
   ===================================================================== */
var CONFIG = {
  meta: {
    title: '대시보드',                    // 브라우저 탭 제목
    paletteKey: 'dashboard-palette',      // 색상 선택 저장 키(프로젝트마다 다르게)
    defaultPalette: null                  // 주제의 기본 색: { name:'오렌지', dark:{bg:'#1A1210',accent:'#FF8A4C'}, light:{bg:'#F8F1EC',accent:'#B8470A'} }
  },
  greetingSub: '이번 달 예산 현황을 한눈에 확인해요.',
  topbar: { left: 'date', pill: { text: '한도 95% 사용', href: '#w-limit' } },   // left: 'date' 또는 문구. pill 은 없어도 됨(진행률 위젯의 pill 이 우선)
  primaryAction: { label: '추가', icon: 'i-plus', href: '#' },                     // 레일의 채워진 원형 버튼(주 행동)

  widgets: [
    { id: 'summary', type: 'hero', span: 4, nav: { label: '요약', icon: 'i-home' },
      label: '이번 달 남은 예산', value: 2187750, unit: '원', chip: '배정의 23%를 썼어요',
      stats: [{ label: '배정', value: 2850000, unit: '원', tone: 'accent' }, { label: '사용', value: 662250, unit: '원' }],
      actions: [{ label: '항목 추가', href: '#', style: 'dark' }, { label: '내역 보기', href: '#w-recent', style: 'light' }] },

    { id: 'trend', type: 'chart', span: 8, nav: { label: '추이', icon: 'i-bars' },
      title: '월별 배정과 사용', subtitle: '최근 6개월 비교', kind: 'bar',
      series: [{ name: '배정', values: [2800000, 2800000, 2850000, 2900000, 2800000, 2850000] },
               { name: '사용', values: [812000, 689000, 755000, 904000, 641000, 662250] }],
      labels: ['6월', '7월', '8월', '9월', '10월', '11월'],
      axis: { unit: '원', compact: 'ko' }, nowIndex: 5, sampleCount: 5,
      note: '지난 달 막대는 화면 확인용 예시 데이터예요. 이번 달만 실제 값이에요.' },

    { id: 'limit', type: 'progress', span: 4, nav: { label: '목표', icon: 'i-gauge' },
      title: '이번 달 사용 한도',
      items: [{ label: '사용액', current: 662250, target: 700000, unit: '원', editable: true, editLabel: '한도 금액', storageKey: 'dashboard-limit',
                remaining: '한도까지 {n} 남았어요. ({p}% 사용)', over: '한도를 {n} 넘겼어요.',
                pill: { text: '한도 {p}% 사용', over: '한도 초과' } }] },

    { id: 'recent', type: 'table', span: 8, nav: { label: '내역', icon: 'i-list' },
      title: '최근 내역',
      columns: [
        { key: 'name', label: '내역', type: 'primary', iconKey: 'group', icons: { 식비: 'i-food', 교통: 'i-transit', 쇼핑: 'i-shop', 여가: 'i-fun', 기타: 'i-etc', 배정: 'i-wallet' } },
        { key: 'group', label: '분류', type: 'text' },
        { key: 'amount', label: '금액', type: 'number', unit: '원', sign: true },
        { key: 'kind', label: '구분', type: 'badge', labels: { in: '배정', out: '사용' } },
        { key: 'date', label: '날짜', type: 'text', align: 'right' }
      ],
      search: { keys: ['name', 'group'], placeholder: '이름·분류 검색' },
      filter: { key: 'kind', options: [{ value: 'all', label: '전체' }, { value: 'in', label: '배정' }, { value: 'out', label: '사용' }] },
      rows: [
        { name: '아침 샌드위치', group: '식비', amount: -6300, kind: 'out', date: '11월 6일' },
        { name: '통신비', group: '기타', amount: -55000, kind: 'out', date: '11월 5일' },
        { name: '택시', group: '교통', amount: -12800, kind: 'out', date: '11월 5일' },
        { name: '저녁 파스타', group: '식비', amount: -18500, kind: 'out', date: '11월 4일' },
        { name: '영화', group: '여가', amount: -15000, kind: 'out', date: '11월 4일' },
        { name: '추가 배정', group: '배정', amount: 50000, kind: 'in', tone: 'accent', date: '11월 3일' },
        { name: '운동화', group: '쇼핑', amount: -89000, kind: 'out', date: '11월 3일' },
        { name: '11월 배정', group: '배정', amount: 2800000, kind: 'in', tone: 'accent', date: '11월 1일' }
      ] }
  ]
};
</script>
<script>
/* 색상 엔진: 배경색 + 강조색 -> 카드·글자·면 색을 계산하고 대비를 검사한다. (skills/front-design/scripts/derive-palette.js 와 같은 계산) */
(function () {
  var WHITE = [255, 255, 255], BLACK = [0, 0, 0];
  function h2r(h) { h = String(h).replace('#', ''); var n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function r2h(c) { return '#' + c.map(function (v) { return Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0'); }).join('').toUpperCase(); }
  function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function lum(c) { return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(a, b, t) { return [0, 1, 2].map(function (i) { return a[i] * (1 - t) + b[i] * t; }); }
  function rgba(c, a) { return 'rgba(' + c.map(Math.round).join(', ') + ', ' + (Math.round(a * 100) / 100) + ')'; }
  function ok(h) { return /^#[0-9a-fA-F]{6}$/.test(h); }

  function derive(bgHex, accHex) {
    var bg = h2r(bgHex), accent = h2r(accHex);
    var dark = lum(bg) < 0.25, toward = dark ? WHITE : BLACK;
    var ink = mix(bg, toward, 0.9);
    for (var t = 0.9; t <= 1.0001; t += 0.01) { ink = mix(bg, toward, t); if (contrast(ink, bg) >= 12) break; }
    var ca = dark ? 0.07 : 0.66, card = mix(bg, WHITE, ca), minR = dark ? 1.10 : 1.04;
    while (contrast(card, bg) < minR && ca < (dark ? 0.16 : 0.9)) { ca += 0.01; card = mix(bg, WHITE, ca); }
    function minAlpha(start, target) { var a = start; while (contrast(mix(card, ink, a), card) < target && a < 1) a += 0.02; return Math.round(a * 100) / 100; }
    var i2 = minAlpha(0.74, 4.5), i3 = minAlpha(0.56, 4.5);
    var darkOn = mix(bg, BLACK, 0.55);
    var onAcc = contrast(WHITE, accent) >= contrast(darkOn, accent) ? WHITE : darkOn;
    var accText = accent.slice();
    for (var s = 0; s <= 1.0001 && contrast(accText, card) < 4.5; s += 0.04) accText = mix(accent, toward, s);
    var top = dark ? mix(bg, WHITE, 0.06) : mix(bg, BLACK, 0.03), bot = dark ? mix(bg, BLACK, 0.12) : mix(bg, WHITE, 0.35);
    var tokens = {
      '--bg': r2h(bg),
      '--bg-grad': 'linear-gradient(165deg, ' + r2h(top) + ' 0%, ' + r2h(bg) + ' 55%, ' + r2h(bot) + ' 100%)',
      '--ink': r2h(ink), '--ink-2': rgba(ink, i2), '--ink-3': rgba(ink, i3), '--rest': rgba(ink, dark ? 0.42 : 0.34),
      '--accent': r2h(accent), '--green': r2h(accent), '--accent-text': r2h(accText),
      '--on-accent': r2h(onAcc), '--on-green': r2h(onAcc),
      '--strong': r2h(ink), '--on-strong': r2h(bg),
      '--card': rgba(WHITE, ca),
      '--well': dark ? rgba(WHITE, 0.07) : rgba(ink, 0.05),
      '--well-2': dark ? rgba(WHITE, 0.12) : rgba(ink, 0.09),
      '--grid': dark ? rgba(WHITE, 0.10) : rgba(ink, 0.10),
      '--edge': dark ? rgba(WHITE, 0.14) : rgba(ink, 0.09),
      '--solid': r2h(mix(bg, WHITE, dark ? 0.09 : 0.85))
    };
    var checks = [
      ['글자와 배경', contrast(ink, bg), 7], ['글자와 카드', contrast(ink, card), 7],
      ['보조 글자', contrast(mix(card, ink, i3), card), 4.5], ['카드와 배경의 구분', contrast(card, bg), minR],
      ['강조색 면 위의 글자', contrast(onAcc, accent), 4.5], ['강조색 글자', contrast(accText, card), 4.5],
      ['강조색 막대·아이콘', contrast(accent, card), 3]
    ].map(function (c) { return { name: c[0], ratio: Math.round(c[1] * 100) / 100, need: c[2], pass: c[1] + 0.005 >= c[2] }; });
    return { mode: dark ? 'dark' : 'light', tokens: tokens, checks: checks };
  }
  function key() { return (window.CONFIG && CONFIG.meta && CONFIG.meta.paletteKey) || 'dashboard-palette'; }
  function defaults() {
    var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var dp = window.CONFIG && CONFIG.meta && CONFIG.meta.defaultPalette;
    if (dp && dp.dark && dp.light && ok(dp.dark.bg) && ok(dp.dark.accent) && ok(dp.light.bg) && ok(dp.light.accent)) return light ? { bg: dp.light.bg, accent: dp.light.accent } : { bg: dp.dark.bg, accent: dp.dark.accent };
    return light ? { bg: '#EFF5F4', accent: '#0A7D69' } : { bg: '#0B161B', accent: '#34D1B2' };
  }
  function load() {
    try { var p = JSON.parse(localStorage.getItem(key())); if (p && ok(p.bg) && ok(p.accent)) return p; } catch (e) {}
    return defaults();
  }
  function save(p) { try { localStorage.setItem(key(), JSON.stringify(p)); } catch (e) {} }
  function apply(p) {
    var d = derive(p.bg, p.accent), root = document.documentElement;
    root.setAttribute('data-theme', d.mode);
    Object.keys(d.tokens).forEach(function (k) { root.style.setProperty(k, d.tokens[k]); });
    return d;
  }
  window.DashboardPalette = { derive: derive, apply: apply, load: load, save: save, defaults: defaults, ok: ok, key: key };
  apply(load());
})();
</script>
<style>
/* 대시보드 템플릿 스타일. 색은 역할 이름의 변수(--accent 등)로만 쓰고, 값은 색상 엔진이 계산해 넣는다. 배경은 단일 그라데이션, 그림자는 위쪽 광원 하나. */
:root {
  --bg-grad: linear-gradient(165deg, #10242A 0%, #0B161B 55%, #0A1216 100%);
  --ink: #EAF4F2;
  --ink-2: rgba(234, 244, 242, .74);
  --ink-3: rgba(234, 244, 242, .56);
  --green: #34D1B2;
  --on-green: #04201A;
  --strong: #EAF4F2;
  --on-strong: #0A1216;
  --card: rgba(255, 255, 255, .07);
  --well: rgba(255, 255, 255, .07);
  --well-2: rgba(255, 255, 255, .12);
  --grid: rgba(255, 255, 255, .10);
  --edge: rgba(255, 255, 255, .14);
  --hl: rgba(255, 255, 255, .34);
  --solid: #15282E;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  --lift-1: 0 6px 18px -10px rgba(0, 0, 0, .5);
  --lift-2: 0 24px 60px -20px rgba(0, 0, 0, .7);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.3, .5, 1);
}
:root[data-theme="light"] {
  --bg-grad: linear-gradient(165deg, #E6F0EE 0%, #EFF5F4 55%, #F4F7F7 100%);
  --ink: #0D1F1D;
  --ink-2: rgba(13, 31, 29, .74);
  --ink-3: rgba(13, 31, 29, .56);
  --green: #0A7D69;
  --on-green: #FFFFFF;
  --strong: #0F1413;
  --on-strong: #FFFFFF;
  --card: rgba(255, 255, 255, .66);
  --well: rgba(13, 31, 29, .05);
  --well-2: rgba(13, 31, 29, .09);
  --grid: rgba(13, 31, 29, .10);
  --edge: rgba(13, 31, 29, .09);
  --hl: rgba(255, 255, 255, .95);
  --solid: #F7FAF9;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  --lift-1: 0 6px 18px -12px rgba(20, 60, 55, .28);
  --lift-2: 0 24px 60px -24px rgba(20, 60, 55, .38);
}
* { box-sizing: border-box; }
html { color-scheme: dark; scroll-behavior: smooth; }
html[data-theme="light"] { color-scheme: light; }
body { margin: 0; min-height: 100vh; background: var(--bg-grad) fixed; background-color: var(--bg, #0A1216); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* 유리는 바깥 패널·레일·탭바에만. 안쪽 카드는 평평한 반투명 면(유리 위에 유리를 겹치지 않는다). */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--edge), var(--lift-2);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--solid); } }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--solid); -webkit-backdrop-filter: none; backdrop-filter: none; } }
.card { border-radius: 24px; background: var(--card); box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--edge), var(--lift-1); min-width: 0; }

/* ---------- 레이아웃 ---------- */
.shell { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 16px; max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; align-items: start; }
/* 레일: 로고 없이 얇은 유리 알약(.rail-nav) 하나에 원형 아이콘 버튼을 세로로 놓고, 맨 아래에 색상 설정 버튼을 둔다.
   선택 표시는 버튼 뒤에서 그려지는 액체 물방울(rail-goo.js)이다. 마우스가 가까우면 부풀고, 옮겨 갈 때 늘어났다 맺힌다.
   rail-goo.js 가 없거나 WebGL 이 안 되면 .nb.active 가 그냥 채워진다. 바깥 .rail 의 glass 는 좁은 화면의 탭바에서만 칠한다. */
.rail { position: sticky; top: 92px; margin-top: 72px; align-self: start; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 30; }
.rail .sp { flex: 1; min-height: 12px; }
.rail-nav { position: relative; display: grid; gap: 6px; justify-items: center; padding: 10px 8px; border-radius: 36px; --goo-color: var(--strong); }
.rail-goo { display: none; position: absolute; pointer-events: none; z-index: 0; }
.nb { position: relative; z-index: 1; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: var(--ink-2); transition: background .2s, color .2s, transform .28s var(--spring), box-shadow .28s; }
.nb:hover { background: var(--well-2); color: var(--ink); transform: translateY(-2px) scale(1.1); }
.nb:not(.active):hover { box-shadow: 0 8px 16px -8px rgba(0, 0, 0, .35); }
.nb:active { transform: scale(.92); transition-duration: .1s; }
.nb svg { width: 20px; height: 20px; }
.nb.main { background: var(--green); color: var(--on-green); }   /* 주 행동은 포인트 색. 선택 표시(강한 중립색)와 겹치지 않게 한다 */
.nb.main:hover { background: var(--green); filter: brightness(1.1); color: var(--on-green); }
.nb.active, .nb.active:hover { background: var(--strong); color: var(--on-strong); }
.rail-nav.goo-on .nb.active, .rail-nav.goo-on .nb.active:hover { background: none; }   /* 물방울이 대신 칠한다. 글자색은 위 규칙의 --on-strong */
.nl { display: none; }
@media (min-width: 900px) {
  .rail-goo { display: block; }
  .rail.glass { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }

<script src="rail-goo.js"></script>   <!-- 레일 물방울(같은 폴더에 함께 복사). 없어도 선택 표시는 채움색으로 동작한다 -->
<script>

(function () {

      (w.chip ? '<span class="chip">' + esc(w.chip) + '</span>' : '') +
      (st.length ? '<div class="split" style="grid-template-columns:repeat(' + st.length + ',minmax(0,1fr))">' + st.map(function (s) { return '<div class="sbox' + (s.tone === 'accent' ? ' in' : '') + '"><span class="tl">' + esc(s.label) + '</span><b>' + valHtml(s.value, s.unit) + '</b></div>'; }).join('') + '</div>' : '') +
      ((w.actions || []).length ? '<div class="btns">' + w.actions.map(function (a) { return '<a class="btn ' + (a.style === 'light' ? 'light' : 'dark') + '" href="' + esc(a.href || '#') + '">' + esc(a.label) + '</a>'; }).join('') + '</div>' : '');
  };

  /* stats: 지표 묶음 */
  R.stats = function (w, el) {

      var pts = a.map(function (v, i) { return [i * W / (a.length - 1), H - 3 - (v - mn) / rg * (H - 6)]; });
      var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''), l = pts[pts.length - 1];
      return '<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="추이"><path d="' + d + '" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* chart: 막대(1~3 시리즈) 또는 선 */

        var bars = kind === 'bar' ? series.map(function (s, k) { return '<i class="bar b' + k + '" style="height:' + Math.max(3, s.values[i] / top * H) + 'px"></i>'; }).join('') : '';

      }).join('');
      cv.innerHTML = '<div class="plotwrap"><div class="plot" style="height:' + H + 'px">' + ticks + (kind === 'line' ? '<svg class="lsvg"></svg>' : '') +
        '<div class="cols" role="list" style="grid-template-columns:repeat(' + n + ',1fr)">' + cols + '</div></div>' +
        '<div class="mlabels" style="grid-template-columns:repeat(' + n + ',1fr)">' + labels.map(function (lb, i) { return '<span' + (i === w.nowIndex ? ' class="now"' : '') + '>' + esc(lb) + '</span>'; }).join('') + '</div></div>';

          var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''), color = ['var(--green)', 'var(--strong)', 'var(--rest)'][k], last = pts[pts.length - 1];
          if (k === 0) out += '<path d="' + d + 'L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + 'L' + pts[0][0].toFixed(1) + ' ' + H + 'Z" fill="var(--green)" opacity=".1"/>';

      labels.map(function (lb, i) { return '<tr><td>' + esc(lb) + '</td>' + series.map(function (s) { return '<td class="ar">' + esc(val(s.values[i])) + '</td>'; }).join('') + (labels.some(function (_, j) { return tag(j); }) ? '<td class="ar">' + esc(tag(i)) + '</td>' : '') + '</tr>'; }).join('') + '</tbody></table>';

  R.table = function (w, el) {

    function al(c) { return c.align === 'right' ? 'ar' : c.align === 'center' ? 'ac' : c.align === 'left' ? '' : (c.type === 'number' || c.type === 'badge') ? 'ar' : ''; }
    function cell(c, r) {
      var v = r[c.key], t = c.type || 'text', accent = r.tone === 'accent', a = al(c), cls = function (x) { x = (x + ' ' + a).trim(); return x ? ' class="' + x + '"' : ''; };
      if (t === 'primary') { var ic = r.icon || (c.icons && c.icons[r[c.iconKey]]) || 'i-receipt'; return '<td' + cls('') + '><span class="who"><span class="bd' + (accent ? ' in' : '') + '">' + icon(ic) + '</span><b>' + esc(v) + '</b></span></td>'; }
      if (t === 'number') { var sg = c.sign ? (v < 0 ? '−' : '+') : ''; return '<td' + cls('amt' + (accent ? ' in' : '')) + '>' + esc(sg + (typeof v === 'number' ? num(Math.abs(v)) : v) + (c.unit || '')) + '</td>'; }
      if (t === 'badge') { return '<td' + cls('') + '><span class="st' + (accent ? ' in' : '') + '"><i></i>' + esc((c.labels && c.labels[v]) || v) + '</span></td>'; }
      return '<td' + cls('') + '>' + esc(v) + '</td>';
    }
    function render() {
      var q = st.q.trim().toLowerCase(), keys = (sr && sr.keys) || [];
      var list = rows.filter(function (r) {
        if (flt && st.f !== 'all' && r[flt.key] !== st.f) return false;
        return !q || keys.some(function (k) { return String(r[k] == null ? '' : r[k]).toLowerCase().indexOf(q) >= 0; });
      });
      if (!list.length) { box.innerHTML = '<p class="empty">' + esc(rows.length ? (w.noMatch || '조건에 맞는 항목이 없어요. 검색어나 필터를 바꿔 보세요.') : (w.empty || '항목이 없어요.')) + '</p>'; return; }
      box.innerHTML = '<table><caption class="vh">' + esc(w.title || '표') + '</caption><thead><tr>' + cols.map(function (c) { return '<th scope="col"' + (al(c) ? ' class="' + al(c) + '"' : '') + '>' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        list.map(function (r) { return '<tr>' + cols.map(function (c) { return cell(c, r); }).join('') + '</tr>'; }).join('') + '</tbody></table>';
    }
    var qi = el.querySelector('.search input');
    if (qi) qi.addEventListener('input', function () { st.q = this.value; render(); });
    var seg = el.querySelector('.seg');
    if (seg) seg.addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (!b) return; st.f = b.dataset.f; seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); render(); });
    render();
  };

  /* list: 순위·구성 목록 */
  R.list = function (w, el) {
    var tid = uid('l'), items = w.items || [], mx = w.max || Math.max.apply(null, items.map(function (i) { return i.value; })) || 1;
    var anyIcon = items.some(function (i) { return i.icon; });
    el.setAttribute('aria-labelledby', tid);
    el.innerHTML = head(w, tid) + '<div class="lrows">' + items.map(function (it, i) {
      return '<div class="lrow' + (i === 0 ? ' top' : '') + (anyIcon ? '' : ' nobd') + '">' + (anyIcon ? '<span class="bd">' + (it.icon ? icon(it.icon) : '') + '</span>' : '') +
        '<span class="ln">' + esc(it.label) + '<span class="lbar"><i style="width:' + Math.max(2, Math.round(it.value / mx * 100)) + '%"></i></span></span>' +
        '<span class="lv">' + esc(num(it.value) + (it.unit || '')) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span></div>';
    }).join('') + '</div>';
  };

  /* callout: 안내·요약 문장 */
  R.callout = function (w, el) {
    var tid = uid('o');
    if (w.title) el.setAttribute('aria-labelledby', tid);
    el.classList.add('callout');
    el.innerHTML = head(w, tid) + '<p class="cb">' + bold(w.text || '') + '</p>';
  };

  /* ---------- 틀: 상단 바 · 인사말 · 위젯 · 레일 ---------- */
  if (M.title) document.title = M.title;
  var now = new Date(), h = now.getHours(), dn = ['일', '월', '화', '수', '목', '금', '토'], tb = C.topbar || {};
  $('greet').textContent = C.greeting || (h < 5 ? '늦은 시간이에요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '좋은 저녁이에요');
  $('sub').textContent = C.greetingSub || '';
  $('topdate').textContent = (tb.left && tb.left !== 'date') ? tb.left : now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + dn[now.getDay()] + '요일';
  if (tb.pill) { var tp = $('tpill'); tp.setAttribute('href', tb.pill.href || '#'); setPill(tb.pill.text, tb.pill.tone === 'alert'); } else $('tpill').hidden = true;

  var board = $('board');
  WG.forEach(function (w) { var r = R[w.type]; if (!r) { if (window.console) console.warn('알 수 없는 위젯 종류:', w.type); return; } var el = shell(w); r(w, el); board.appendChild(el); if (el.__after) el.__after(); });

  var navItems = (C.nav || WG.filter(function (w) { return w.nav; }).map(function (w) { return { label: w.nav.label, icon: w.nav.icon, href: '#w-' + w.id }; }));
  if (C.primaryAction) navItems = navItems.concat([{ label: C.primaryAction.label, icon: C.primaryAction.icon, href: C.primaryAction.href || '#', primary: true }]);
  $('rail').innerHTML = '<div class="rail-nav glass" id="railNav">' + navItems.map(function (n) {
    return '<a class="nb' + (n.primary ? ' main' : '') + '" href="' + esc(n.href) + '" aria-label="' + esc(n.label) + '" data-tip="' + esc(n.label) + '">' + icon(n.icon) + '<span class="nl">' + esc(n.label) + '</span></a>';
  }).join('') + '</div><span class="sp"></span>' +
    '<button class="nb" id="palBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="pal" aria-label="색상 설정" data-tip="색상 설정">' + icon('i-palette') + '<span class="nl">색상</span></button>';

  /* ---------- 레일 선택 표시: 스크롤 위치를 따라 현재 구역을 표시하고, 액체 물방울(rail-goo.js)이 따라간다 ---------- */
  (function railSpy() {
    var navEl = $('railNav'), links = [].slice.call(navEl.querySelectorAll('.nb:not(.main)'));
    var secs = links.map(function (a) { var h = a.getAttribute('href'); return h && h.charAt(0) === '#' && h.length > 1 ? document.getElementById(h.slice(1)) : null; });
    var current = null, lockUntil = 0, ticking = false;
    function gooMove(animate) {
      var btn = navEl.querySelector('.nb.active'), G = window.RailGoo;
      if (G && btn && window.matchMedia('(min-width: 900px)').matches && G.move(navEl, btn, animate)) { navEl.classList.add('goo-on'); return; }
      navEl.classList.remove('goo-on');
      if (G) G.hide();
    }
    function setActive(i, animate) {
      if (i === current) return;
      current = i;
      links.forEach(function (a, k) { a.classList.toggle('active', k === i); if (k === i) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current'); });
      gooMove(animate);
    }
    function spy() {
      ticking = false;
      if (Date.now() < lockUntil) return;
      var line = window.innerHeight * 0.35, pick = -1, k;
      for (k = 0; k < secs.length; k++) { if (secs[k] && secs[k].getBoundingClientRect().top <= line) pick = k; }
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) { for (k = secs.length - 1; k >= 0; k--) { if (secs[k]) { pick = k; break; } } }
      setActive(pick < 0 ? 0 : pick, true);
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
    links.forEach(function (a, k) { a.addEventListener('click', function () { lockUntil = Date.now() + 900; setActive(k, true); }); });
    window.addEventListener('resize', function () { gooMove(false); });
    window.addEventListener('load', function () { gooMove(false); });
    if (window.RailGoo) window.RailGoo.onFail = function () { gooMove(false); };
    setActive(0, false);
  })();

  /* ---------- 색상 설정 패널 ---------- */
  var LP = window.DashboardPalette;
  var BASE = [
    ['초록 다크', '#0B161B', '#34D1B2'], ['초록 라이트', '#EFF5F4', '#0A7D69'],
    ['보라 다크', '#14101F', '#9B7BFF'], ['보라 라이트', '#F3F0FA', '#5B3FD1'],
    ['파랑 다크', '#0B1220', '#5B9DFF'], ['파랑 라이트', '#EEF2F8', '#1D5FD1'],
    ['주황 다크', '#1A1210', '#FF8A4C'], ['주황 라이트', '#F8F1EC', '#B8470A']
  ];
  var DP = M.defaultPalette, PRESETS = BASE.slice();
  if (DP && DP.dark && DP.light) {   // 주제의 기본 색을 추천 조합 맨 앞에 두고, 같은 색은 중복 제거
    var nm = DP.name || '기본', extra = [[nm + ' 다크', DP.dark.bg, DP.dark.accent], [nm + ' 라이트', DP.light.bg, DP.light.accent]];
    PRESETS = extra.concat(BASE.filter(function (p) { return !extra.some(function (e) { return e[1].toLowerCase() === p[1].toLowerCase() && e[2].toLowerCase() === p[2].toLowerCase(); }); })).slice(0, 8);
  }
  var pal = $('pal'), palBtn = $('palBtn'), cur = LP.load();
  $('sws').innerHTML = PRESETS.map(function (p, i) {
    return '<button class="sw" type="button" data-i="' + i + '" aria-pressed="false" aria-label="' + p[0] + '"><i style="--sb:' + p[1] + ';--sa:' + p[2] + '"></i>' + p[0] + '</button>';
  }).join('');
  function syncPanel(d) {
    $('cBg').value = cur.bg.toLowerCase(); $('cAcc').value = cur.accent.toLowerCase();
    $('tBg').textContent = cur.bg.toUpperCase(); $('tAcc').textContent = cur.accent.toUpperCase();
    $('sws').querySelectorAll('.sw').forEach(function (b) {
      var p = PRESETS[+b.dataset.i];
      b.setAttribute('aria-pressed', String(p[1].toLowerCase() === cur.bg.toLowerCase() && p[2].toLowerCase() === cur.accent.toLowerCase()));
    });
    var bad = d.checks.filter(function (c) { return !c.pass; });
    $('palStatus').innerHTML = bad.length
      ? '<b>확인이 필요해요.</b> ' + bad.slice(0, 3).map(function (c) { return c.name + ' ' + c.ratio + ':1(기준 ' + c.need + ':1)'; }).join(', ') + '. 강조색이나 배경색을 조금 바꿔 보세요.'
      : '대비 검사를 모두 통과했어요.';
  }
  function setPal(p, persist) { cur = { bg: p.bg, accent: p.accent }; var d = LP.apply(cur); if (persist) LP.save(cur); syncPanel(d); }
  function placePal() {
    if (window.innerWidth < 900) { pal.style.left = ''; pal.style.top = ''; return; }
    var r = document.querySelector('.rail').getBoundingClientRect();
    pal.style.left = Math.round(r.right + 12) + 'px';
    pal.style.top = Math.max(12, Math.round(r.top)) + 'px';
  }
  window.addEventListener('resize', function () { if (!pal.hidden) placePal(); });
  window.addEventListener('scroll', function () { if (!pal.hidden) placePal(); }, { passive: true });
  function openPal(open) {
    if (open) placePal();
    pal.hidden = !open;
    palBtn.setAttribute('aria-expanded', String(open));
    if (open) { (pal.querySelector('.sw[aria-pressed="true"]') || pal.querySelector('.sw')).focus(); } else palBtn.focus();
  }
  palBtn.addEventListener('click', function () { openPal(pal.hidden); });
  $('palClose').addEventListener('click', function () { openPal(false); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !pal.hidden) openPal(false); });
  document.addEventListener('pointerdown', function (ev) { if (!pal.hidden && !pal.contains(ev.target) && !palBtn.contains(ev.target)) { pal.hidden = true; palBtn.setAttribute('aria-expanded', 'false'); } });
  $('sws').addEventListener('click', function (ev) { var b = ev.target.closest('.sw'); if (b) { var p = PRESETS[+b.dataset.i]; setPal({ bg: p[1], accent: p[2] }, true); } });
  $('cBg').addEventListener('input', function () { setPal({ bg: this.value, accent: cur.accent }, true); });
  $('cAcc').addEventListener('input', function () { setPal({ bg: cur.bg, accent: this.value }, true); });
  $('palReset').addEventListener('click', function () { try { localStorage.removeItem(LP.key()); } catch (e) {} setPal(LP.defaults(), false); });
  syncPanel(LP.derive(cur.bg, cur.accent));

  /* ---------- 처음 열 때 한 번: 인사말과 카드가 위에서부터 차례로 떠오른다 ----------
     바깥 유리 패널은 그대로 두고 안쪽 덩어리만 움직인다(블러가 걸린 큰 면을 통째로 투명 처리하면 버벅인다).
     끝나면 transform 이 남지 않게 정리하고, '동작 줄이기' 설정이면 건너뛴다. */
  (function staggerReveal() {
    if (!document.body.animate) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var panel = document.querySelector('.panel');
    if (!panel) return;
    var items = [].slice.call(panel.querySelectorAll(':scope > .greet, :scope > .board > *'));
    items.slice(0, 8).forEach(function (el, i) {
      el.style.willChange = 'transform, opacity';   // 미리 별도 레이어로 올려 두면 움직임이 덜 끊긴다
      var a = el.animate(
        [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }],
        { duration: 560, delay: i * 45, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }
      );
      var done = function () { el.style.willChange = ''; };
      a.onfinish = done; a.oncancel = done;
    });
  })();
})();
</script>
</body>
