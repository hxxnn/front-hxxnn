<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<!--
  대시보드 템플릿 (front-hxxnn 플러그인)
  사용법: 이 파일을 복사한 뒤 아래 <script> 안의 CONFIG(주제·문구·데이터)만 바꾼다.
  - 구조(아이콘 레일, 떠 있는 상단 바, 큰 유리 패널, 카드 4개, 색상 설정 패널)와 스타일은 바꾸지 않는다.
  - 카드 4개: 핵심 수치(hero) / 추이 차트(chart) / 목표·한도(goal) / 최근 활동 표(table)
  - 샘플 값에는 "예시"라고 표시되어 있다. 실제 데이터로 바꾸면 chart.note를 지운다.
  - 아이콘은 아래 스프라이트(<symbol id="i-...">)에 있는 것만 쓴다. 필요하면 같은 형식으로 추가한다.
-->
<script>window.__PALETTE_KEY = 'dashboard-palette'; /* 팔레트 저장 키: 프로젝트마다 다르게 */</script>
<script>
/* 색상 엔진: 배경색 + 강조색 -> 카드·글자·면 색을 계산하고 대비를 검사한다. (skills/front-design/scripts/derive-palette.js 와 같은 계산) */
(function () {
  var WHITE = [255, 255, 255], BLACK = [0, 0, 0];
  function h2r(h) { h = String(h).replace('#', ''); var n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function r2h(c) { return '#' + c.map(function (v) { return Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0'); }).join('').toUpperCase(); }
  function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function lum(c) { return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(a, b, t) { return [0, 1, 2].map(function (i) { return a[i] * (1 - t) + b[i] * t; }); }
  function rgba(c, a) { return 'rgba(' + c.map(Math.round).join(', ') + ', ' + (Math.round(a * 100) / 100) + ')'; }
  function ok(h) { return /^#[0-9a-fA-F]{6}$/.test(h); }

  function derive(bgHex, accHex) {
    var bg = h2r(bgHex), accent = h2r(accHex);
    var dark = lum(bg) < 0.25, toward = dark ? WHITE : BLACK;
    var ink = mix(bg, toward, 0.9);
    for (var t = 0.9; t <= 1.0001; t += 0.01) { ink = mix(bg, toward, t); if (contrast(ink, bg) >= 12) break; }
    var ca = dark ? 0.07 : 0.66, card = mix(bg, WHITE, ca), minR = dark ? 1.10 : 1.04;
    while (contrast(card, bg) < minR && ca < (dark ? 0.16 : 0.9)) { ca += 0.01; card = mix(bg, WHITE, ca); }
    function minAlpha(start, target) { var a = start; while (contrast(mix(card, ink, a), card) < target && a < 1) a += 0.02; return Math.round(a * 100) / 100; }
    var i2 = minAlpha(0.74, 4.5), i3 = minAlpha(0.56, 4.5);
    var darkOn = mix(bg, BLACK, 0.55);
    var onAcc = contrast(WHITE, accent) >= contrast(darkOn, accent) ? WHITE : darkOn;
    var accText = accent.slice();
    for (var s = 0; s <= 1.0001 && contrast(accText, card) < 4.5; s += 0.04) accText = mix(accent, toward, s);
    var top = dark ? mix(bg, WHITE, 0.06) : mix(bg, BLACK, 0.03), bot = dark ? mix(bg, BLACK, 0.12) : mix(bg, WHITE, 0.35);
    var tokens = {
      '--bg': r2h(bg),
      '--bg-grad': 'linear-gradient(165deg, ' + r2h(top) + ' 0%, ' + r2h(bg) + ' 55%, ' + r2h(bot) + ' 100%)',
      '--ink': r2h(ink), '--ink-2': rgba(ink, i2), '--ink-3': rgba(ink, i3),
      '--accent': r2h(accent), '--green': r2h(accent), '--accent-text': r2h(accText),
      '--on-accent': r2h(onAcc), '--on-green': r2h(onAcc),
      '--strong': r2h(ink), '--on-strong': r2h(bg),
      '--card': rgba(WHITE, ca),
      '--well': dark ? rgba(WHITE, 0.07) : rgba(ink, 0.05),
      '--well-2': dark ? rgba(WHITE, 0.12) : rgba(ink, 0.09),
      '--grid': dark ? rgba(WHITE, 0.10) : rgba(ink, 0.10),
      '--edge': dark ? rgba(WHITE, 0.14) : rgba(ink, 0.09),
      '--solid': r2h(mix(bg, WHITE, dark ? 0.09 : 0.85))
    };
    var checks = [
      ['글자와 배경', contrast(ink, bg), 7], ['글자와 카드', contrast(ink, card), 7],
      ['보조 글자', contrast(mix(card, ink, i3), card), 4.5], ['카드와 배경의 구분', contrast(card, bg), minR],
      ['강조색 면 위의 글자', contrast(onAcc, accent), 4.5], ['강조색 글자', contrast(accText, card), 4.5],
      ['강조색 막대·아이콘', contrast(accent, card), 3]
    ].map(function (c) { return { name: c[0], ratio: Math.round(c[1] * 100) / 100, need: c[2], pass: c[1] + 0.005 >= c[2] }; });
    return { mode: dark ? 'dark' : 'light', tokens: tokens, checks: checks };
  }
  function defaults() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
      ? { bg: '#EFF5F4', accent: '#0A7D69' } : { bg: '#0B161B', accent: '#34D1B2' };
  }
  function load() {
    try { var p = JSON.parse(localStorage.getItem((window.__PALETTE_KEY || 'dashboard-palette'))); if (p && ok(p.bg) && ok(p.accent)) return p; } catch (e) {}
    return defaults();
  }
  function save(p) { try { localStorage.setItem((window.__PALETTE_KEY || 'dashboard-palette'), JSON.stringify(p)); } catch (e) {} }
  function apply(p) {
    var d = derive(p.bg, p.accent), root = document.documentElement;
    root.setAttribute('data-theme', d.mode);
    Object.keys(d.tokens).forEach(function (k) { root.style.setProperty(k, d.tokens[k]); });
    return d;
  }
  window.DashboardPalette = { derive: derive, apply: apply, load: load, save: save, defaults: defaults, ok: ok };
  apply(load());
})();
</script>
<style>
/* 대시보드 템플릿 스타일. 색은 역할 이름의 변수(--accent 등)로만 쓰고, 값은 색상 엔진이 계산해 넣는다. 배경은 단일 그라데이션, 그림자는 위쪽 광원 하나. */
:root {
  --bg-grad: linear-gradient(165deg, #10242A 0%, #0B161B 55%, #0A1216 100%);
  --ink: #EAF4F2;
  --ink-2: rgba(234, 244, 242, .74);
  --ink-3: rgba(234, 244, 242, .56);
  --green: #34D1B2;
  --on-green: #04201A;
  --strong: #EAF4F2;
  --on-strong: #0A1216;
  --card: rgba(255, 255, 255, .07);
  --well: rgba(255, 255, 255, .07);
  --well-2: rgba(255, 255, 255, .12);
  --grid: rgba(255, 255, 255, .10);
  --edge: rgba(255, 255, 255, .14);
  --hl: rgba(255, 255, 255, .34);
  --solid: #15282E;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  --lift-1: 0 6px 18px -10px rgba(0, 0, 0, .5);
  --lift-2: 0 24px 60px -20px rgba(0, 0, 0, .7);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.3, .5, 1);
}
:root[data-theme="light"] {
  --bg-grad: linear-gradient(165deg, #E6F0EE 0%, #EFF5F4 55%, #F4F7F7 100%);
  --ink: #0D1F1D;
  --ink-2: rgba(13, 31, 29, .74);
  --ink-3: rgba(13, 31, 29, .56);
  --green: #0A7D69;
  --on-green: #FFFFFF;
  --strong: #0F1413;
  --on-strong: #FFFFFF;
  --card: rgba(255, 255, 255, .66);
  --well: rgba(13, 31, 29, .05);
  --well-2: rgba(13, 31, 29, .09);
  --grid: rgba(13, 31, 29, .10);
  --edge: rgba(13, 31, 29, .09);
  --hl: rgba(255, 255, 255, .95);
  --solid: #F7FAF9;
  --glass-bg: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.34));
  --lift-1: 0 6px 18px -12px rgba(20, 60, 55, .28);
  --lift-2: 0 24px 60px -24px rgba(20, 60, 55, .38);
}
* { box-sizing: border-box; }
html { color-scheme: dark; scroll-behavior: smooth; }
html[data-theme="light"] { color-scheme: light; }
body { margin: 0; min-height: 100vh; background: var(--bg-grad) fixed; background-color: var(--bg, #0A1216); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* 유리는 바깥 패널·레일·탭바에만. 안쪽 카드는 평평한 반투명 면(유리 위에 유리를 겹치지 않는다). */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--edge), var(--lift-2);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--solid); } }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--solid); -webkit-backdrop-filter: none; backdrop-filter: none; } }
.card { border-radius: 24px; background: var(--card); box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--edge), var(--lift-1); min-width: 0; }

/* ---------- 레이아웃 ---------- */
.shell { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 16px; max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; align-items: start; }
/* 레일: 로고 없이 얇은 유리 알약(.rail-nav) 하나에 원형 아이콘 버튼을 세로로 놓고, 맨 아래에 색상 설정 버튼을 둔다.
   선택 표시는 버튼 뒤에서 그려지는 액체 물방울(rail-goo.js)이다. 마우스가 가까우면 부풀고, 옮겨 갈 때 늘어났다 맺힌다.
   rail-goo.js 가 없거나 WebGL 이 안 되면 .nb.active 가 그냥 채워진다. 바깥 .rail 의 glass 는 좁은 화면의 탭바에서만 칠한다. */
.rail { position: sticky; top: 92px; margin-top: 72px; align-self: start; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 30; }
.rail .sp { flex: 1; min-height: 12px; }
.rail-nav { position: relative; display: grid; gap: 6px; justify-items: center; padding: 10px 8px; border-radius: 36px; --goo-color: var(--strong); }
.rail-goo { display: none; position: absolute; pointer-events: none; z-index: 0; }
.nb { position: relative; z-index: 1; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: var(--ink-2); transition: background .2s, color .2s, transform .28s var(--spring), box-shadow .28s; }
.nb:hover { background: var(--well-2); color: var(--ink); transform: translateY(-2px) scale(1.1); }
.nb:not(.active):hover { box-shadow: 0 8px 16px -8px rgba(0, 0, 0, .35); }
.nb:active { transform: scale(.92); transition-duration: .1s; }
.nb svg { width: 20px; height: 20px; }
.nb.main { background: var(--green); color: var(--on-green); }   /* 주 행동은 포인트 색. 선택 표시(강한 중립색)와 겹치지 않게 한다 */
.nb.main:hover { background: var(--green); filter: brightness(1.1); color: var(--on-green); }
.nb.active, .nb.active:hover { background: var(--strong); color: var(--on-strong); }
.rail-nav.goo-on .nb.active, .rail-nav.goo-on .nb.active:hover { background: none; }   /* 물방울이 대신 칠한다. 글자색은 위 규칙의 --on-strong */
.nl { display: none; }
@media (min-width: 900px) {
  .rail-goo { display: block; }
  .rail.glass { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .nb[data-tip]:hover::after, .nb[data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%); padding: 5px 12px; border-radius: 8px; background: var(--strong); color: var(--on-strong); font-size: .75rem; font-weight: 600; white-space: nowrap; pointer-events: none; z-index: 5; }
}
@media (prefers-reduced-motion: reduce) { .nb { transition: background .2s, color .2s; } .nb:hover, .nb:active { transform: none; } }
/* ---------- 색상 설정 패널 ---------- */
.pal { position: fixed; z-index: 60; left: 84px; top: 92px; width: 330px; max-height: calc(100vh - 112px); overflow: auto; padding: 20px 20px 18px; border-radius: 28px; }
.pal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.pal h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.pal-close { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--well-2); font-weight: 600; font-size: .88rem; }
.pal-sub { margin: 0 0 14px; color: var(--ink-2); font-size: .88rem; }
.pal h3 { margin: 14px 0 8px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
.sws { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.sw { display: grid; justify-items: center; gap: 6px; padding: 0; border: 0; background: transparent; font-size: .74rem; color: var(--ink-2); }
.sw i { width: 44px; height: 44px; border-radius: 50%; display: block; background: linear-gradient(135deg, var(--sb) 50%, var(--sa) 50%); box-shadow: inset 0 0 0 1px var(--edge); transition: transform .2s var(--spring); }
.sw:active i { transform: scale(.92); }
.sw[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.sw[aria-pressed="true"] i { outline: 2px solid var(--green); outline-offset: 3px; }
.pick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 8px 12px; border-radius: 18px; background: var(--well); }
.pick + .pick { margin-top: 8px; }
.pick label { font-size: .9rem; font-weight: 500; }
.pick small { grid-column: 1; color: var(--ink-3); font-size: .78rem; font-variant-numeric: tabular-nums; }
.pick input[type="color"] { grid-column: 2; grid-row: 1 / span 2; width: 48px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: transparent; cursor: pointer; }
.pal-status { margin: 14px 2px 0; font-size: .86rem; color: var(--ink-2); }
.pal-status b { color: var(--ink); }
.pal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.pal-foot .link { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--well-2); font-weight: 600; font-size: .88rem; }
@media (max-width: 899px) { .pal { left: 16px; right: 16px; top: auto; bottom: 92px; width: auto; max-height: 70vh; } }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; align-content: start; }
.topbar { position: sticky; top: 20px; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 6px 8px 6px 22px; border-radius: 999px; }
.tdate { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.tdate svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.tdate span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpill { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; background: var(--well-2); font-size: .9rem; font-weight: 600; white-space: nowrap; transition: transform .2s var(--spring), background .2s; }
.tpill:hover { background: var(--well); }
.tpill:active { transform: scale(.96); }
.tpill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: block; }
.tpill.over i { background: var(--strong); }
.panel { border-radius: 36px; padding: 28px 28px 28px; min-width: 0; }
.greet { margin: 0 0 20px 4px; }
.greet h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.greet p { margin: 4px 0 0; color: var(--ink-2); }
.board { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "bal" "chart" "limit" "act"; }
.a-bal { grid-area: bal; } .a-tiles { grid-area: tiles; } .a-chart { grid-area: chart; } .a-limit { grid-area: limit; } .a-act { grid-area: act; }
@media (min-width: 1000px) { .board { grid-template-columns: minmax(300px, .8fr) minmax(0, 1.5fr); grid-template-areas: "bal chart" "limit act"; } }
section[id] { scroll-margin-top: 20px; }

@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-bottom: 112px; }
  .topbar { top: 12px; padding-left: 18px; }
  .rail { position: fixed; left: 16px; right: 16px; bottom: 12px; top: auto; margin-top: 0; flex-direction: row; justify-content: space-around; align-items: stretch; gap: 0; padding: 8px 6px; border-radius: 30px; }
  .rail-nav { display: contents; }
  .rail .sp { display: none; }
  .nb { width: auto; flex: 1; height: 56px; border-radius: 22px; gap: 2px; align-content: center; }
  .nb:hover { transform: none; }
  .nb svg { width: 22px; height: 22px; justify-self: center; }
  .nl { display: block; font-size: .7rem; line-height: 1; }
  .panel { padding: 20px 14px 18px; border-radius: 30px; }
}

/* ---------- 남은 돈 ---------- */
.bal { padding: 22px 22px 22px; display: flex; flex-direction: column; }
.tl { margin: 0; color: var(--ink-2); font-size: .92rem; }
.hero-amount { margin: 8px 0 8px; font-size: clamp(2.6rem, 6vw, 3rem); line-height: 1.08; font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.hero-amount small { font-size: .45em; font-weight: 600; letter-spacing: 0; margin-left: 4px; color: var(--ink-2); }
.chip { align-self: flex-start; display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: var(--well-2); font-size: .82rem; font-weight: 600; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.sbox { padding: 12px 14px; border-radius: 18px; background: var(--well); min-width: 0; }
.sbox .tl { display: block; font-size: .82rem; }
.sbox b { display: block; margin-top: 2px; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.sbox.in { background: var(--green); color: var(--on-green); }
.sbox.in .tl { color: var(--on-green); opacity: .92; }
.btns { margin-top: auto; padding-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 120px; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; font-weight: 700; transition: transform .2s var(--spring), filter .2s; white-space: nowrap; }
.btn.dark { background: var(--strong); color: var(--on-strong); }
.btn.light { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--edge); }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.97); }

/* ---------- 수치 카드 2x2 ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { padding: 16px 16px 14px; display: flex; flex-direction: column; min-width: 0; }
.tile .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--well-2); color: var(--ink-2); flex: none; }
.dot svg { width: 15px; height: 15px; }
.tv { margin: 14px 0 0; font-size: clamp(1.05rem, 1.7vw, 1.3rem); line-height: 1.2; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; }
.ts { margin: auto 0 0; padding-top: 12px; }
.pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--well-2); font-size: .74rem; font-weight: 600; }
.tile.fill { background: var(--green); color: var(--on-green); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--lift-1); }

:root:not([data-theme="light"]) .tile.fill .pill { background: rgba(4,32,26,.16); }

/* ---------- 수입·지출 차트 ---------- */
.chartcard { padding: 20px 20px 16px; display: flex; flex-direction: column; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }

.gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--grid); }
.gl span { position: absolute; left: -52px; top: -.7em; width: 44px; text-align: right; white-space: nowrap; font-size: .76rem; color: var(--ink-3); }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; }

.bi, .be { width: min(14px, 30%); border-radius: 4px 4px 0 0; }

.be { background: var(--strong); }

.mlabels .now { color: var(--ink); font-weight: 600; }
.foot { margin: 10px 0 0; color: var(--ink-3); font-size: .8rem; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

tbody tr:last-child td { border-bottom: 0; }

/* ---------- 한도 ---------- */

  /* ---------- 레일 · 상단 바 · 인사말 ---------- */
  $('rail').innerHTML = '<div class="rail-nav glass" id="railNav">' + C.nav.map(function (n) {
    return '<a class="nb' + (n.primary ? ' main' : '') + '" href="' + esc(n.href) + '" aria-label="' + esc(n.label) + '" data-tip="' + esc(n.label) + '">' + icon(n.icon) + '<span class="nl">' + esc(n.label) + '</span></a>';
  }).join('') + '</div><span class="sp"></span>' +
    '<button class="nb" id="palBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="pal" aria-label="색상 설정" data-tip="색상 설정">' + icon('i-palette') + '<span class="nl">색상</span></button>';

  /* ---------- 레일 선택 표시: 스크롤 위치를 따라 현재 구역을 표시하고, 액체 물방울(rail-goo.js)이 따라간다 ---------- */
  (function railSpy() {
    var navEl = $('railNav'), links = [].slice.call(navEl.querySelectorAll('.nb:not(.main)'));
    var secs = links.map(function (a) { var h = a.getAttribute('href'); return h && h.charAt(0) === '#' && h.length > 1 ? document.getElementById(h.slice(1)) : null; });
    var current = null, lockUntil = 0, ticking = false;
    function gooMove(animate) {
      var btn = navEl.querySelector('.nb.active'), G = window.RailGoo;
      if (G && btn && window.matchMedia('(min-width: 900px)').matches && G.move(navEl, btn, animate)) { navEl.classList.add('goo-on'); return; }
      navEl.classList.remove('goo-on');
      if (G) G.hide();
    }
    function setActive(i, animate) {
      if (i === current) return;
      current = i;
      links.forEach(function (a, k) { a.classList.toggle('active', k === i); if (k === i) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current'); });
      gooMove(animate);
    }
    function spy() {
      ticking = false;
      if (Date.now() < lockUntil) return;
      var line = window.innerHeight * 0.35, pick = -1, k;
      for (k = 0; k < secs.length; k++) { if (secs[k] && secs[k].getBoundingClientRect().top <= line) pick = k; }
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) { for (k = secs.length - 1; k >= 0; k--) { if (secs[k]) { pick = k; break; } } }
      setActive(pick < 0 ? 0 : pick, true);
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
    links.forEach(function (a, k) { a.addEventListener('click', function () { lockUntil = Date.now() + 900; setActive(k, true); }); });
    window.addEventListener('resize', function () { gooMove(false); });
    window.addEventListener('load', function () { gooMove(false); });
    if (window.RailGoo) window.RailGoo.onFail = function () { gooMove(false); };
    setActive(0, false);
  })();
  var now = new Date(), h = now.getHours(), dn = ['일', '월', '화', '수', '목', '금', '토'];
  $('greet').textContent = h < 5 ? '늦은 시간이에요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
  $('sub').textContent = C.greetingSub;
  $('topdate').textContent = now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + dn[now.getDay()] + '요일';

  /* ---------- 핵심 수치 카드 ---------- */
  $('bl').textContent = C.hero.label;
  $('heroValue').innerHTML = (C.hero.value < 0 ? '−' : '') + Math.abs(C.hero.value).toLocaleString('ko-KR') + '<small>' + esc(C.unit) + '</small>';
  $('heroChip').textContent = C.hero.chip;
  $('kpis').innerHTML = C.hero.kpis.map(function (k) {
    return '<div class="sbox' + (k.accent ? ' in' : '') + '"><span class="tl">' + esc(k.label) + '</span><b>' + won(k.value) + '</b></div>';
  }).join('');
  $('actions').innerHTML = C.hero.actions.map(function (a) {
    return '<a class="btn ' + (a.style === 'light' ? 'light' : 'dark') + '" href="' + esc(a.href) + '">' + esc(a.label) + '</a>';
  }).join('');

  /* ---------- 추이 차트 (시리즈 2개) ---------- */
  var ch = C.chart, H = 210, chart = $('chart'), tbl = $('tbl');
  $('ch').textContent = ch.title; $('chSub').textContent = ch.subtitle; $('chNote').textContent = ch.note || '';
  $('legend').innerHTML = ch.series.map(function (s, i) { return '<span class="' + (i === 0 ? 'in' : 'ex') + '"><i></i>' + esc(s.name) + '</span>'; }).join('');
  (function drawChart() {
    var maxV = Math.max.apply(null, ch.values[0].concat(ch.values[1])) * 1.08;
    var steps = [10000, 20000, 25000, 50000, 100000, 200000, 250000, 500000, 1000000, 2000000, 2500000, 5000000, 10000000], step = steps[steps.length - 1], k;
    for (k = 0; k < steps.length; k++) { if (Math.ceil(maxV / steps[k]) <= 4) { step = steps[k]; break; } }
    var top = Math.ceil(maxV / step) * step, ticks = '';
    for (var t = 0; t <= top; t += step) ticks += '<div class="gl" style="bottom:' + (t / top * H) + 'px"><span>' + (t ? man(t) : '0') + '</span></div>';
    var cols = ch.labels.map(function (lb, i) {
      var tag = i === ch.nowIndex ? '진행 중' : (i < ch.sampleCount ? '예시 데이터' : '');
      return '<div class="col" tabindex="0" data-i="' + i + '" role="listitem" aria-label="' + esc(lb) + ' ' + esc(ch.series[0].name) + ' ' + won(ch.values[0][i]) + ', ' + esc(ch.series[1].name) + ' ' + won(ch.values[1][i]) + (tag ? ', ' + tag : '') + '">' +
        '<i class="bi" style="height:' + Math.max(3, ch.values[0][i] / top * H) + 'px"></i><i class="be" style="height:' + Math.max(3, ch.values[1][i] / top * H) + 'px"></i></div>';
    }).join('');
    chart.innerHTML = '<div class="plotwrap"><div class="plot" style="height:' + H + 'px">' + ticks + '<div class="cols" role="list">' + cols + '</div></div>' +
      '<div class="mlabels">' + ch.labels.map(function (lb, i) { return '<span' + (i === ch.nowIndex ? ' class="now"' : '') + '>' + esc(lb) + '</span>'; }).join('') + '</div></div>';
    chart.querySelectorAll('.col').forEach(function (el) {
      var i = +el.dataset.i, tag = i === ch.nowIndex ? '진행 중인 달' : (i < ch.sampleCount ? '예시 데이터' : '');
      function show(x, y) {
        tip.innerHTML = '<b>' + esc(ch.labels[i]) + '</b><span>' + esc(ch.series[0].name) + ' ' + won(ch.values[0][i]) + '</span><br><span>' + esc(ch.series[1].name) + ' ' + won(ch.values[1][i]) + '</span>' + (tag ? '<br><span>' + tag + '</span>' : '');
        tip.classList.add('on');
        var w = tip.offsetWidth, hh = tip.offsetHeight;
        tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + 'px';
        tip.style.top = Math.max(8, Math.min(window.innerHeight - hh - 8, y - hh - 10)) + 'px';
      }
      el.addEventListener('pointermove', function (ev) { show(ev.clientX, ev.clientY); });
      el.addEventListener('pointerleave', function () { tip.classList.remove('on'); });
      el.addEventListener('focus', function () { var b = el.getBoundingClientRect(); show(b.left + b.width / 2, b.top); });
      el.addEventListener('blur', function () { tip.classList.remove('on'); });
    });
    tbl.innerHTML = '<table><caption class="vh">' + esc(ch.title) + ' 표</caption><thead><tr><th scope="col">기간</th><th scope="col">' + esc(ch.series[0].name) + '</th><th scope="col">' + esc(ch.series[1].name) + '</th><th scope="col">구분</th></tr></thead><tbody>' +
      ch.labels.map(function (lb, i) { return '<tr><td>' + esc(lb) + '</td><td>' + won(ch.values[0][i]) + '</td><td>' + won(ch.values[1][i]) + '</td><td>' + (i === ch.nowIndex ? '진행 중' : (i < ch.sampleCount ? '예시' : '')) + '</td></tr>'; }).join('') + '</tbody></table>';
  })();
  $('switch').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', String(on));
    this.textContent = on ? '차트로 보기' : '표로 보기';
    chart.hidden = on; tbl.hidden = !on; tip.classList.remove('on');
  });

  /* ---------- 목표·한도 카드 (입력하면 막대·문구·상단 알약이 함께 바뀐다) ---------- */
  var g = C.goal, target = g.target;
  try { var saved = parseInt(localStorage.getItem(g.storageKey), 10); if (saved > 0) target = saved; } catch (e) {}
  $('gh').textContent = g.title; $('gLabel').textContent = g.label; $('gUnit').textContent = C.unit;
  var goalEl = $('goal');
  function renderGoal() {
    var p = Math.round(g.current / target * 100), over = g.current > target;
    $('gMeter').style.width = Math.min(100, p) + '%';
    $('gMeterA11y').setAttribute('aria-label', g.label + ' 대비 ' + p + '%');
    $('gNote').textContent = over ? fill(g.over, { n: won(g.current - target) }) : fill(g.remaining, { n: won(target - g.current), p: p });
    $('toppill').textContent = over ? g.pillOver : fill(g.pill, { p: p });
    document.querySelector('.tpill').classList.toggle('over', over);
  }
  goalEl.value = target.toLocaleString('ko-KR');
  goalEl.addEventListener('input', function () {
    var d = goalEl.value.replace(/\D/g, '').slice(0, 12), v = d ? parseInt(d, 10) : 0;
    goalEl.value = v ? v.toLocaleString('ko-KR') : '';
    if (v > 0) { target = v; try { localStorage.setItem(g.storageKey, String(v)); } catch (e) {} renderGoal(); }
  });
  goalEl.addEventListener('blur', function () { goalEl.value = target.toLocaleString('ko-KR'); });
  renderGoal();

  /* ---------- 최근 활동 표: 검색 · 필터 ---------- */
  var T = C.table, state = { q: '', f: 'all' };
  $('ah').textContent = T.title; $('q').placeholder = T.searchPlaceholder;
  $('filter').innerHTML = T.filters.map(function (f, i) { return '<button type="button" data-f="' + f.key + '" aria-pressed="' + (i === 0) + '">' + esc(f.label) + '</button>'; }).join('');
  function renderRows() {
    var q = state.q.trim().toLowerCase();
    var rows = T.rows.filter(function (r) {
      if (state.f !== 'all' && r.kind !== state.f) return false;
      return !q || r.name.toLowerCase().indexOf(q) >= 0 || r.group.toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) { $('rows').innerHTML = '<p class="empty">' + (T.rows.length ? T.noMatch : T.empty) + '</p>'; return; }
    $('rows').innerHTML = '<table><caption class="vh">' + esc(T.title) + '</caption><thead><tr>' + T.headers.map(function (x) { return '<th scope="col">' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        var isIn = r.kind === 'in';
        return '<tr><td><span class="who"><span class="bd' + (isIn ? ' in' : '') + '">' + icon(T.icons[r.group] || 'i-receipt') + '</span><b>' + esc(r.name) + '</b></span></td>' +
          '<td>' + esc(r.group) + '</td><td class="amt' + (isIn ? ' in' : '') + '">' + (isIn ? '+' : '−') + won(r.amount) + '</td>' +
          '<td><span class="st' + (isIn ? ' in' : '') + '"><i></i>' + esc(T.kindLabels[r.kind]) + '</span></td><td>' + esc(r.date) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  $('q').addEventListener('input', function () { state.q = this.value; renderRows(); });
  $('filter').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    state.f = b.dataset.f;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    renderRows();
  });
  renderRows();

  /* ---------- 색상 설정 패널 ---------- */
  var LP = window.DashboardPalette;
  var PRESETS = [
    ['초록 다크', '#0B161B', '#34D1B2'], ['초록 라이트', '#EFF5F4', '#0A7D69'],
    ['보라 다크', '#14101F', '#9B7BFF'], ['보라 라이트', '#F3F0FA', '#5B3FD1'],
    ['파랑 다크', '#0B1220', '#5B9DFF'], ['파랑 라이트', '#EEF2F8', '#1D5FD1'],
    ['주황 다크', '#1A1210', '#FF8A4C'], ['주황 라이트', '#F8F1EC', '#B8470A']
  ];
  var pal = $('pal'), palBtn = $('palBtn'), cur = LP.load();
  $('sws').innerHTML = PRESETS.map(function (p, i) {
    return '<button class="sw" type="button" data-i="' + i + '" aria-pressed="false" aria-label="' + p[0] + '"><i style="--sb:' + p[1] + ';--sa:' + p[2] + '"></i>' + p[0] + '</button>';
  }).join('');
  function syncPanel(d) {
    $('cBg').value = cur.bg.toLowerCase(); $('cAcc').value = cur.accent.toLowerCase();
    $('tBg').textContent = cur.bg.toUpperCase(); $('tAcc').textContent = cur.accent.toUpperCase();
    $('sws').querySelectorAll('.sw').forEach(function (b) {
      var p = PRESETS[+b.dataset.i];
      b.setAttribute('aria-pressed', String(p[1].toLowerCase() === cur.bg.toLowerCase() && p[2].toLowerCase() === cur.accent.toLowerCase()));
    });
    var bad = d.checks.filter(function (c) { return !c.pass; });
    $('palStatus').innerHTML = bad.length
      ? '<b>확인이 필요해요.</b> ' + bad.slice(0, 3).map(function (c) { return c.name + ' ' + c.ratio + ':1(기준 ' + c.need + ':1)'; }).join(', ') + '. 강조색이나 배경색을 조금 바꿔 보세요.'
      : '대비 검사를 모두 통과했어요.';
  }
  function setPal(p, persist) { cur = { bg: p.bg, accent: p.accent }; var d = LP.apply(cur); if (persist) LP.save(cur); syncPanel(d); }
  function placePal() {
    if (window.innerWidth < 900) { pal.style.left = ''; pal.style.top = ''; return; }
    var r = document.querySelector('.rail').getBoundingClientRect();
    pal.style.left = Math.round(r.right + 12) + 'px';
    pal.style.top = Math.max(12, Math.round(r.top)) + 'px';
  }
  window.addEventListener('resize', function () { if (!pal.hidden) placePal(); });
  window.addEventListener('scroll', function () { if (!pal.hidden) placePal(); }, { passive: true });
  function openPal(open) {
    if (open) placePal();
    pal.hidden = !open;
    palBtn.setAttribute('aria-expanded', String(open));
    if (open) { (pal.querySelector('.sw[aria-pressed="true"]') || pal.querySelector('.sw')).focus(); } else palBtn.focus();
  }
  palBtn.addEventListener('click', function () { openPal(pal.hidden); });
  $('palClose').addEventListener('click', function () { openPal(false); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !pal.hidden) openPal(false); });
  document.addEventListener('pointerdown', function (ev) { if (!pal.hidden && !pal.contains(ev.target) && !palBtn.contains(ev.target)) { pal.hidden = true; palBtn.setAttribute('aria-expanded', 'false'); } });
  $('sws').addEventListener('click', function (ev) { var b = ev.target.closest('.sw'); if (b) { var p = PRESETS[+b.dataset.i]; setPal({ bg: p[1], accent: p[2] }, true); } });
  $('cBg').addEventListener('input', function () { setPal({ bg: this.value, accent: cur.accent }, true); });
  $('cAcc').addEventListener('input', function () { setPal({ bg: cur.bg, accent: this.value }, true); });
  $('palReset').addEventListener('click', function () { try { localStorage.removeItem(window.__PALETTE_KEY); } catch (e) {} setPal(LP.defaults(), false); });
  syncPanel(LP.derive(cur.bg, cur.accent));

  /* ---------- 처음 열 때 한 번: 인사말과 카드가 위에서부터 차례로 떠오른다 ----------
     바깥 유리 패널은 그대로 두고 안쪽 덩어리만 움직인다(블러가 걸린 큰 면을 통째로 투명 처리하면 버벅인다).
     끝나면 transform 이 남지 않게 정리하고, '동작 줄이기' 설정이면 건너뛴다. */
  (function staggerReveal() {
    if (!document.body.animate) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var panel = document.querySelector('.panel');
    if (!panel) return;
    var items = [].slice.call(panel.querySelectorAll(':scope > .greet, :scope > .board > *'));
    items.slice(0, 8).forEach(function (el, i) {
      el.style.willChange = 'transform, opacity';   // 미리 별도 레이어로 올려 두면 움직임이 덜 끊긴다
      var a = el.animate(
        [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }],
        { duration: 560, delay: i * 45, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }
      );
      var done = function () { el.style.willChange = ''; };
      a.onfinish = done; a.oncancel = done;
    });
  })();
})();
</script>
</body>
</html>
